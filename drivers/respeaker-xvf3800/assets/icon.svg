<?xml version="1.0" encoding="UTF-8"?>
<!-- ReSpeaker XVF3800: top view of the cased 4-mic circular array.
     Monochrome line art to match the other voice-assistant driver icons. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g fill="none" stroke="#000000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- enclosure -->
    <rect x="112" y="112" width="800" height="800" rx="140" ry="140"/>
    <!-- top plate -->
    <circle cx="512" cy="512" r="330"/>
    <!-- LED ring -->
    <circle cx="512" cy="512" r="252" stroke-width="18"/>
  </g>
  <g fill="#000000">
    <!-- the four microphones of the circular array -->
    <circle cx="637" cy="387" r="30"/>
    <circle cx="387" cy="387" r="30"/>
    <circle cx="387" cy="637" r="30"/>
    <circle cx="637" cy="637" r="30"/>
    <!-- centre boss -->
    <circle cx="512" cy="512" r="66"/>
  </g>
</svg>
