<!-- AtomS3R-specific start view. Like the ReSpeaker copy this offers no
     Bluetooth (Improv) option: M5Stack's official ESPHome config has no
     esp32_improv component, and the firmware is flashed over USB with the
     Wi-Fi credentials already baked in, so there is never anything to
     provision over BLE. Keep the styling in sync with the other drivers'
     start.html. -->
<style>
  .va-start {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .va-start p.lead {
    margin: 4px 0 8px;
    text-align: center;
    font-size: 15px;
  }
  .va-start button.choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(128, 128, 128, 0.35);
    background: rgba(128, 128, 128, 0.08);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .va-start button.choice b {
    display: block;
    font-size: 15px;
    margin-bottom: 3px;
  }
  .va-start button.choice span {
    display: block;
    font-size: 13px;
    opacity: 0.7;
  }
  .va-start .hint {
    font-size: 12px;
    opacity: 0.6;
    text-align: center;
    margin-top: 6px;
  }
</style>

<div class="va-start">
  <p class="lead">How do you want to add your AtomS3R?</p>

  <button type="button" class="choice" id="va-choice-lan">
    <b>Find it on my network</b>
    <span>The device is already connected to Wi-Fi</span>
  </button>

  <button type="button" class="choice" id="va-choice-manual">
    <b>Enter IP address manually</b>
    <span>The scan can't find it (e.g. mDNS isn't reaching your Homey)</span>
  </button>

  <p class="hint">This device gets its Wi-Fi details when you flash its ESPHome firmware, so there is no Bluetooth setup step.</p>
</div>

<script type="application/javascript">
  document.getElementById('va-choice-lan').addEventListener('click', function () {
    Homey.showView('list_devices');
  });
  document.getElementById('va-choice-manual').addEventListener('click', function () {
    Homey.showView('manual_entry');
  });
</script>
